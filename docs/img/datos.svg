<text x="32" y="69" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6573">Qué se guarda, dónde y cómo se protege.</text>
<rect x="32" y="96" width="520" height="560" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<text x="52" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#15171c" text-anchor="start">Qué hay en el repositorio</text>
