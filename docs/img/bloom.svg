<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d">
<title id="t">Taxonomía de Bloom</title>
<desc id="d">Seis niveles cognitivos, de recordar a crear, con un ejemplo de Data Science en cada uno y el lugar donde la app los usa.</desc>
<defs>
<marker id="ah-5f6573" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#5f6573"/></marker><marker id="as-5f6573" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#5f6573"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.08"/></filter>
</defs>
<rect width="1100" height="700" rx="18" fill="#f4f6fa"/>
<text x="32" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15171c">Taxonomía de Bloom</text>
<text x="32" y="69" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6573">Qué tipo de esfuerzo mental pide cada etapa, de recordar a crear.</text>
<rect x="36" y="345" width="163" height="175" rx="14" fill="#e6ecfd" stroke="#e6ecfd" stroke-width="1.2" filter="url(#sh)"/>
<text x="52" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#15171c" text-anchor="start">1</text>
<text x="52" y="413" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#15171c" text-anchor="start">Recordar</text>
<text x="52" y="435" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#3a3f4b" text-anchor="start">Nombrar y listar.</text>
<text x="52" y="463" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">¿Qué hace GROUP BY?</text>
<rect x="209" y="307" width="163" height="213" rx="14" fill="#d3dcfb" stroke="#d3dcfb" stroke-width="1.2" filter="url(#sh)"/>
<text x="225" y="349" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#15171c" text-anchor="start">2</text>
<text x="225" y="375" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#15171c" text-anchor="start">Comprender</text>
<text x="225" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#3a3f4b" text-anchor="start">Explicar con tus palabras.</text>
<text x="225" y="425" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">¿Por qué un LEFT JOIN</text>
<text x="225" y="441" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">conserva todas las</text>
<text x="225" y="457" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">filas de la izquierda?</text>
<rect x="382" y="269" width="163" height="251" rx="14" fill="#b9c7f7" stroke="#b9c7f7" stroke-width="1.2" filter="url(#sh)"/>
<text x="398" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#15171c" text-anchor="start">3</text>
<text x="398" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#15171c" text-anchor="start">Aplicar</text>
<text x="398" y="359" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#3a3f4b" text-anchor="start">Usar en un caso concreto.</text>
<text x="398" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">Escribe la consulta</text>
<text x="398" y="403" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">que agrega las ventas</text>
<text x="398" y="419" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">por ciudad.</text>
<rect x="555" y="231" width="163" height="289" rx="14" fill="#8ea5f2" stroke="#8ea5f2" stroke-width="1.2" filter="url(#sh)"/>
<text x="571" y="273" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#15171c" text-anchor="start">4</text>
<text x="571" y="299" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#15171c" text-anchor="start">Analizar</text>
<text x="571" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#3a3f4b" text-anchor="start">Descomponer y comparar.</text>
<text x="571" y="349" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">¿Por qué el conteo se</text>
<text x="571" y="365" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">infló después del</text>
<text x="571" y="381" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3a3f4b" text-anchor="start">JOIN?</text>
<rect x="728" y="193" width="163" height="327" rx="14" fill="#5f7fe9" stroke="#5f7fe9" stroke-width="1.2" filter="url(#sh)"/>
<text x="744" y="235" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="start">5</text>
<text x="744" y="261" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#fff" text-anchor="start">Evaluar</text>
<text x="744" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#e8eeff" text-anchor="start">Juzgar y justificar.</text>
<text x="744" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eeff" text-anchor="start">¿Qué métrica eliges</text>
<text x="744" y="327" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eeff" text-anchor="start">para este modelo y por</text>
<text x="744" y="343" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eeff" text-anchor="start">qué?</text>
<rect x="901" y="155" width="163" height="365" rx="14" fill="#2f5bea" stroke="#2f5bea" stroke-width="1.2" filter="url(#sh)"/>
<text x="917" y="197" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="start">6</text>
<text x="917" y="223" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#fff" text-anchor="start">Crear</text>
<text x="917" y="245" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#e8eeff" text-anchor="start">Diseñar algo nuevo.</text>
<text x="917" y="273" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eeff" text-anchor="start">Plantea el pipeline</text>
<text x="917" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eeff" text-anchor="start">completo, de los datos</text>
<text x="917" y="305" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eeff" text-anchor="start">a la decisión.</text>
<path d="M40,118 L1040,118" fill="none" stroke="#5f6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-5f6573)"/>
<text x="40" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5f6573" text-anchor="start">más complejo</text>
<text x="36" y="556" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15171c" text-anchor="start">Dónde lo usa la app</text>
<rect x="36" y="568" width="509" height="24" rx="8" fill="#e3f4ea" stroke="#e3f4ea" stroke-width="0"/>
<text x="46" y="584.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#1d7a4a" text-anchor="start">Test final de retención: preguntas de Bloom 1 a 3 (R21)</text>
<rect x="382" y="598" width="163" height="24" rx="8" fill="#fdf0d5" stroke="#fdf0d5" stroke-width="0"/>
<text x="392" y="614.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#94560a" text-anchor="start">Arranque: Bloom 3</text>
<rect x="555" y="598" width="509" height="24" rx="8" fill="#efe9fb" stroke="#efe9fb" stroke-width="0"/>
<text x="565" y="614.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#6b3fc9" text-anchor="start">Etapa de integración (Business): Bloom 4 o más</text>
<rect x="36" y="628" width="1028" height="24" rx="8" fill="#edf1fe" stroke="#edf1fe" stroke-width="0"/>
<text x="46" y="644.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#2f5bea" text-anchor="start">Plan calibrado: el siguiente Bloom es el más alto que aprobaste sin ayuda más 1 (tope 6); con 2 o más fallos no sube.</text>
<text x="36" y="678" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6573" text-anchor="start">Cada etapa de un challenge declara su Bloom; cada pregunta del test también. Cuentan como evidencia del concepto al que están atadas.</text>
</svg>
