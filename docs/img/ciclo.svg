<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d">
<title id="t">Ciclo de un challenge</title>
<desc id="d">Ocho pasos: el orquestador planifica, el Generador escribe, las compuertas validan, tú resuelves, se verifica, registras y el Analista actualiza el grafo.</desc>
<defs>
<marker id="ah-2f5bea" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2f5bea"/></marker><marker id="as-2f5bea" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#2f5bea"/></marker><marker id="ah-5f6573" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#5f6573"/></marker><marker id="as-5f6573" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#5f6573"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.08"/></filter>
</defs>
<rect width="1100" height="640" rx="18" fill="#f4f6fa"/>
<text x="32" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15171c">Ciclo de un challenge</text>
<text x="32" y="69" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6573">De «Generar nuevo challenge» a un grafo de conocimiento actualizado con tu evidencia.</text>
<rect x="40" y="110" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="68" cy="140" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="68" y="145.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="92" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Plan de calibración</text>
<rect x="56" y="162" width="80.6" height="22" rx="11.0" fill="#edf1fe" stroke="#edf1fe" stroke-width="0"/>
<text x="96.3" y="176.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f5bea" text-anchor="middle">Orquestador</text>
<text x="56" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Decide qué practicar según tu</text>
<text x="56" y="225" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">grafo y tu evidencia: refuerzo,</text>
<text x="56" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">avance e integración.</text>
<rect x="310" y="110" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="338" cy="140" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="338" y="145.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="362" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Generador</text>
<rect x="326" y="162" width="47.599999999999994" height="22" rx="11.0" fill="#fdf0d5" stroke="#fdf0d5" stroke-width="0"/>
<text x="349.8" y="176.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94560a" text-anchor="middle">Agente</text>
<text x="326" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Escribe el caso por fases:</text>
<text x="326" y="225" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">esqueleto, una etapa por llamada</text>
<text x="326" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">y test final.</text>
<rect x="580" y="110" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="608" cy="140" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="608" y="145.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="632" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Compuertas</text>
<rect x="596" y="162" width="80.6" height="22" rx="11.0" fill="#edf1fe" stroke="#edf1fe" stroke-width="0"/>
<text x="636.3" y="176.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f5bea" text-anchor="middle">Orquestador</text>
<text x="596" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Seed en DuckDB, solución de</text>
<text x="596" y="225" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">referencia igual a expected,</text>
<text x="596" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">esquema y plan. Si falla, repara</text>
<text x="596" y="259" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">(máx. 2).</text>
<rect x="850" y="110" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="878" cy="140" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="878" y="145.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="902" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Publicar</text>
<rect x="866" y="162" width="80.6" height="22" rx="11.0" fill="#edf1fe" stroke="#edf1fe" stroke-width="0"/>
<text x="906.3" y="176.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f5bea" text-anchor="middle">Orquestador</text>
<text x="866" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Un rename atómico a</text>
<text x="866" y="225" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">challenge/challenge-NNN/. Nunca</text>
<text x="866" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">queda nada a medias.</text>
<rect x="850" y="370" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="878" cy="400" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="878" y="405.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="902" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Resolver</text>
<rect x="866" y="422" width="21.2" height="22" rx="11.0" fill="#e3f4ea" stroke="#e3f4ea" stroke-width="0"/>
<text x="876.6" y="436.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1d7a4a" text-anchor="middle">Tú</text>
<text x="866" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Lees el enunciado en la app y</text>
<text x="866" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">resuelves en tu notebook de VS</text>
<text x="866" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Code.</text>
<rect x="580" y="370" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="608" cy="400" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="608" y="405.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="632" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Verificar</text>
<rect x="596" y="422" width="140.0" height="22" rx="11.0" fill="#efe9fb" stroke="#efe9fb" stroke-width="0"/>
<text x="666.0" y="436.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b3fc9" text-anchor="middle">Orquestador + agente</text>
<text x="596" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Ejecuta tu celda, compara con lo</text>
<text x="596" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">esperado y el Evaluador explica</text>
<text x="596" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">en vivo.</text>
<rect x="310" y="370" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="338" cy="400" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="338" y="405.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="362" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Registrar etapa</text>
<rect x="326" y="422" width="21.2" height="22" rx="11.0" fill="#e3f4ea" stroke="#e3f4ea" stroke-width="0"/>
<text x="336.6" y="436.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1d7a4a" text-anchor="middle">Tú</text>
<text x="326" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Evidence: resultado, tiempo del</text>
<text x="326" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">cronómetro, dónde te trabaste y</text>
<text x="326" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">notas. Inmutable.</text>
<rect x="40" y="370" width="230" height="160" rx="14" fill="#ffffff" stroke="#dfe3ec" stroke-width="1.2" filter="url(#sh)"/>
<circle cx="68" cy="400" r="15" fill="#2f5bea" stroke="none" stroke-width="0"/>
<text x="68" y="405.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="92" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#15171c" text-anchor="start">Analista</text>
<rect x="56" y="422" width="47.599999999999994" height="22" rx="11.0" fill="#fdf0d5" stroke="#fdf0d5" stroke-width="0"/>
<text x="79.8" y="436.85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94560a" text-anchor="middle">Agente</text>
<text x="56" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Lee tus notas, las vincula con</text>
<text x="56" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">conceptos y propone al grafo, en</text>
<text x="56" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">segundo plano.</text>
