<text x="168" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2f5bea" text-anchor="start">tu grafo y tu nivel calibran el siguiente challenge</text>
<rect x="40" y="560" width="1020" height="54" rx="12" fill="#edf1fe" stroke="#c9d4fa" stroke-width="1.2"/>
<text x="60" y="583" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f5bea" text-anchor="start">Entre un challenge y otro:</text>
<text x="60" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.3" font-weight="400" fill="#3a3f4b" text-anchor="start">Repaso, la ventana de debilidad, el test final de retención y el Nivel por dominio usan la misma evidencia que verá el Generador.</text>
