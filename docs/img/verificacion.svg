<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d">
<title id="t">Verificar una etapa</title>
<desc id="d">El orquestador ejecuta tu celda en Python y decide el resultado; el Evaluador solo lo explica. Todo llega a la ventana en vivo.</desc>
